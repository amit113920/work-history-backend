# Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/work_history

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=Amit@admin

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Optional formatting
spring.jpa.properties.hibernate.format_sql=true
server.port=8085

##############################ldap##################
spring.ldap.urls=ldap://localhost:389
spring.ldap.base=dc=mycompany,dc=com
spring.ldap.username=cn=admin,dc=mycompany,dc=com
spring.ldap.password=adminpassword

# Match the user pattern configured in your LDIF (searching inside ou=users by cn or uid)
spring.security.ldap.user-dn-pattern=cn={0},ou=users
